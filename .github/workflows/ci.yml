name: CI

# Trigger on every push and pull-request targeting main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Type-check
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript — type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Unit and integration tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests — Jest + Vitest
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Jest tests
        run: npm run test:jest

      - name: Run Vitest tests
        run: npm run test:vitest

  # ---------------------------------------------------------------------------
  # generate-shot-list smoke test (filmbuff-prompt Phases 7–9 — bd-05fa, bd-2bc8, bd-e4d2)
  #
  # Validates AC-1 through AC-16 end-to-end:
  #   AC-1:  Every shot has a 'Video Controls' block in Markdown output.
  #   AC-2:  Duration (s) is never "Default" — always a concrete integer in [3,60].
  #   AC-6:  Pre-existing shot fields preserved verbatim.
  #   AC-7:  apiKey MUST never appear in batch payload JSON.
  #   AC-8:  --provider mock produces valid output without API key; exit 0.
  #   AC-9:  --offline skips all network calls; exit 0.
  #   AC-10: --batch-output writes valid batch.json.
  #   AC-11: Top-level references map in batch.json when shots have references.
  #   AC-12: Per-shot references contain symbolic keys only (no raw URLs).
  #   AC-13: Dual-keyframe auto-suggestion applied for 2-ref shots with non-lumaai envelope.
  #   AC-14: Pre-export validator rules V-1 through V-6 apply (blocking errors halt export).
  #   AC-15: V-3 URL reachability check skipped when CI=true.
  #   AC-16: --batch-output --jsonl writes JSONL with _type:references sentinel on line 1.
  # ---------------------------------------------------------------------------
  shot-list-smoke:
    name: generate-shot-list — mock provider smoke test (AC-1 through AC-16)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify filmbuff.config.json — mock + lumaai providers present
        run: |
          node -e "
            const cfg = require('./filmbuff.config.json');
            const mock = cfg.videoProviders.find(p => p.id === 'mock');
            if (!mock) { console.error('FAIL: mock provider not found in filmbuff.config.json'); process.exit(1); }
            const luma = cfg.videoProviders.find(p => p.id === 'lumaai');
            if (!luma) { console.error('FAIL: lumaai provider not found in filmbuff.config.json'); process.exit(1); }
            if (luma.maxI2VImages !== 2) { console.error('FAIL: lumaai.maxI2VImages must be 2 for dual-keyframe (AC-13)'); process.exit(1); }
            if (mock.apiKeyEnvVar !== null) { console.error('FAIL: mock.apiKeyEnvVar must be null (AC-8)'); process.exit(1); }
            if (mock.maxI2VImages !== -1) { console.error('FAIL: mock.maxI2VImages must be -1 (unlimited) for CI'); process.exit(1); }
            console.log('PASS: filmbuff.config.json is correct (AC-8, AC-13)');
          "

      - name: Run generate-shot-list with mock provider — Markdown output (AC-1, AC-2, AC-6, AC-8)
        run: |
          FIXTURE="cli/src/__tests__/fixtures/test-film.fountain"
          OUTPUT="/tmp/shot-list-ci-output.md"

          node dist/cli.js generate-shot-list \
            --input "$FIXTURE" \
            --provider mock \
            --output "$OUTPUT" \
            --format md \
            --offline

          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then echo "FAIL: generate-shot-list exited $EXIT_CODE"; exit 1; fi

          # AC-1: assert 'Video Controls' block present in output
          if ! grep -q 'Video Controls' "$OUTPUT"; then
            echo "FAIL: 'Video Controls' not found in output (AC-1)"
            cat "$OUTPUT"
            exit 1
          fi

          # AC-6: assert shot headings present (pre-existing field preservation)
          if ! grep -qP 'INT\.|EXT\.' "$OUTPUT"; then
            echo "FAIL: Shot headings not found in output (AC-6)"
            cat "$OUTPUT"
            exit 1
          fi

          echo "PASS: Markdown output smoke test (AC-1, AC-2, AC-6, AC-8)"

      - name: Run generate-shot-list with --batch-output — JSON payload (AC-7, AC-10, AC-11, AC-12)
        run: |
          FIXTURE="cli/src/__tests__/fixtures/test-film.fountain"
          BATCH_OUT="/tmp/shot-list-ci-batch.json"

          node dist/cli.js generate-shot-list \
            --input "$FIXTURE" \
            --provider mock \
            --batch-output "$BATCH_OUT" \
            --offline

          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then echo "FAIL: generate-shot-list --batch-output exited $EXIT_CODE"; exit 1; fi

          # AC-7: apiKey MUST NOT appear in batch.json
          if grep -qi 'apikey\|api_key\|api-key' "$BATCH_OUT"; then
            echo "FAIL: apiKey found in batch.json — security invariant violated (AC-7)"
            exit 1
          fi

          # AC-10: batch.json must be valid JSON with expected fields
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('$BATCH_OUT', 'utf-8'));
            if (!p.provider) { console.error('FAIL: batch.json missing provider (AC-10)'); process.exit(1); }
            if (!Array.isArray(p.items)) { console.error('FAIL: batch.json missing items array (AC-10)'); process.exit(1); }
            if (!p.items.every(i => typeof i.duration === 'number' && i.duration >= 3 && i.duration <= 60)) {
              console.error('FAIL: some item duration is invalid (AC-2)'); process.exit(1);
            }
            if (!p.items.every(i => i.modality === 'video')) {
              console.error('FAIL: some item is missing modality=video (AC-10)'); process.exit(1);
            }
            console.log('PASS: batch.json structure valid (AC-7, AC-10)');
          "

      - name: Run generate-shot-list with --batch-output --jsonl — JSONL format (AC-16)
        run: |
          FIXTURE="cli/src/__tests__/fixtures/test-film.fountain"
          JSONL_OUT="/tmp/shot-list-ci-batch.jsonl"

          node dist/cli.js generate-shot-list \
            --input "$FIXTURE" \
            --provider mock \
            --batch-output "$JSONL_OUT" \
            --jsonl \
            --offline

          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then echo "FAIL: generate-shot-list --jsonl exited $EXIT_CODE"; exit 1; fi

          # AC-16: verify all lines are valid JSON objects
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('$JSONL_OUT', 'utf-8').split('\n').filter(l => l.trim().length > 0);
            for (const line of lines) {
              try { JSON.parse(line); } catch (e) { console.error('FAIL: invalid JSONL line:', line); process.exit(1); }
            }
            console.log('PASS: all', lines.length, 'JSONL lines are valid JSON (AC-16)');
          "

      - name: Run unit + integration tests for filmbuff-prompt Phases 7-9
        env:
          CI: "true"
        run: |
          npx jest \
            cli/src/__tests__/batch-serializer.test.ts \
            cli/src/__tests__/references.test.ts \
            cli/src/__tests__/pre-export-validator.test.ts \
            cli/src/__tests__/duration-derivation.test.ts \
            cli/src/__tests__/video-controls.test.ts \
            cli/src/__tests__/filmbuff-config.test.ts \
            cli/src/__tests__/integration/shot-list-snapshot.integration.test.ts \
            --no-coverage --ci

          echo "PASS: All Phase 7-9 unit and integration tests passed (AC-1 through AC-16)"
