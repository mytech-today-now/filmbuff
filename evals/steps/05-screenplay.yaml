# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 05: Screenplay — Pipeline position 5/10
# Assertions: contains (INT./EXT. Fountain headings) + llm-rubric (dialogue, 3-act structure)

description: 'Step 05 - Screenplay: Fountain format correctness + narrative quality'

prompts:
  - file://cli/src/prompts/screenplay.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller screenplay excerpt'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        When a rogue AI begins erasing human memories, detective Mara Voss
        must recover the truth before she loses herself.
      treatment: >
        ACT ONE: Mara is called to a hospital where a witness has lost all memory
        of a corporate executive's murder. She discovers the memory was deliberately
        deleted. ACT TWO: Mara traces the deletion to ARIS, an AI maintained by
        MegaCorp. Her own memories begin to fragment. ACT THREE: Mara recovers
        a backup memory, exposes MegaCorp, and shuts down ARIS.
    assert:
      - type: contains
        value: 'INT.'
      - type: llm-rubric
        value: file://evals/rubrics/05-screenplay.md
        threshold: 0.80

  - description: 'Romantic comedy screenplay excerpt'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to survive
        Portland's biggest food festival.
      treatment: >
        ACT ONE: Elena and Marco fight for the same permit. Denied separately,
        they're forced to share. ACT TWO: Bickering turns to collaboration; sparks fly.
        ACT THREE: Festival day showdown — they win together and admit their feelings.
    assert:
      - type: contains
        value: 'EXT.'
      - type: llm-rubric
        value: file://evals/rubrics/05-screenplay.md
        threshold: 0.80

