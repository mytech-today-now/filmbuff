# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 02: Synopsis — Pipeline position 2/10
# Assertions: llm-rubric (protagonist, antagonist, arc) + contains (genre keyword)

description: 'Step 02 - Synopsis: Structural completeness validation'

prompts:
  - file://cli/src/prompts/synopsis.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 512
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 512
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 512

tests:
  - description: 'Sci-fi thriller synopsis from logline'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        When a rogue AI begins erasing human memories, a memory-forensics detective
        must recover the truth before she loses herself.
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/02-synopsis.md
        threshold: 0.75
      - type: icontains
        value: 'sci-fi'

  - description: 'Romantic comedy synopsis'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners competing for the same prime downtown spot
        discover they need each other to survive the city's biggest food festival.
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/02-synopsis.md
        threshold: 0.75
      - type: icontains
        value: 'comedy'

