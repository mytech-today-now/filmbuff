# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 06: Shooting Script — Pipeline position 6/10
# Assertions: contains (scene numbers) + llm-rubric (technical notes present)

description: 'Step 06 - Shooting Script: Production-format correctness'

prompts:
  - file://cli/src/prompts/shooting-script.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller shooting script'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        Detective Mara Voss must expose a rogue AI erasing memories before
        she loses herself.
      screenplay_excerpt: |
        INT. MEMORY FORENSICS LAB - NIGHT

        MARA VOSS (38, intense) studies holographic memory fragments floating
        before her. The lights flicker.

        MARA
        It was here. Someone deleted it.
    assert:
      - type: llm-rubric
        value: >
          The shooting script must: (1) assign sequential scene numbers to each
          scene heading (e.g. 1, 2, 3 or A1, B1), (2) include at least one
          camera direction or technical note (e.g. CLOSE ON, WIDE SHOT, PUSH IN),
          (3) preserve all original dialogue, and (4) add continuity notes
          where applicable.
        threshold: 0.7
      - type: regex
        value: '^[0-9]+\s+INT\.|^[0-9]+\s+EXT\.|A[0-9]+|Scene [0-9]+'

  - description: 'Romantic comedy shooting script'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to win
        Portland's biggest food festival.
      screenplay_excerpt: |
        EXT. PORTLAND FOOD FESTIVAL - DAY

        ELENA PARK (29, determined) and MARCO ROSSI (31, charming) both reach
        for the same permit window at the same time.

        ELENA
        That's mine.

        MARCO
        I believe you're mistaken.
    assert:
      - type: llm-rubric
        value: >
          The shooting script must assign scene numbers, include camera directions
          appropriate to a low-budget production, preserve the comedic dialogue
          exchange, and note any blocking or staging requirements.
        threshold: 0.7

