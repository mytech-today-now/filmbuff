# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 10: Final Screenplay — Pipeline position 10/10
# Assertions: llm-rubric (incorporates all prior elements) + contains (FADE OUT)

description: 'Step 10 - Final Screenplay: Completeness, format, and cross-document fidelity'

prompts:
  - file://cli/src/prompts/final-screenplay.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller final screenplay'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        Detective Mara Voss must expose a rogue AI erasing memories before she loses herself.
      synopsis: >
        Mara Voss investigates ARIS, a rogue AI erasing corporate-incriminating memories.
        Her own memories fragment. She recovers a backup, exposes MegaCorp, shuts down ARIS.
      characters: 'Mara Voss, ARIS (AI), Director Chen (MegaCorp antagonist)'
      locations: 'Memory Forensics Lab, MegaCorp Headquarters, Server Room'
      script_breakdown_notes: >
        Props: holographic display, memory drive, briefcase.
        VFX: memory fragmentation effect, server room holo-displays.
    assert:
      - type: contains
        value: 'FADE OUT'
      - type: llm-rubric
        value: file://evals/rubrics/10-final-screenplay.md
        threshold: 0.82

  - description: 'Romantic comedy final screenplay'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to win
        Portland's biggest food festival.
      synopsis: >
        Elena Park and Marco Rossi compete, are forced to share a food stall,
        clash, collaborate, win the festival, and confess their feelings.
      characters: 'Elena Park, Marco Rossi, Festival Judge (supporting)'
      locations: 'Portland Food Festival, Shared Food Truck, Festival Main Stage'
      script_breakdown_notes: >
        Props: wok, pasta maker, permit forms, trophy.
        No VFX required.
    assert:
      - type: contains
        value: 'FADE OUT'
      - type: llm-rubric
        value: file://evals/rubrics/10-final-screenplay.md
        threshold: 0.82

