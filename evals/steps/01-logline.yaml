# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 01: Logline — Pipeline position 1/10
# Assertions: llm-rubric (single sentence, conflict, hook)

description: 'Step 01 - Logline: Regression + model comparison'

prompts:
  - file://cli/src/prompts/logline.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 256
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 256
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 256

tests:
  - description: 'Sci-fi thriller logline'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline_seed: 'A rogue AI begins rewriting human memories.'
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/01-logline.md
        threshold: 0.80
      - type: regex
        value: '^[A-Z].{10,200}[.!?]$'

  - description: 'Romantic comedy logline'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline_seed: 'Two rival food truck owners compete for the same prime spot.'
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/01-logline.md
        threshold: 0.80
      - type: regex
        value: '^[A-Z].{10,200}[.!?]$'

