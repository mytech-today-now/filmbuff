# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 04: Beat Sheet — Pipeline position 4/10
# Assertions: is-json + json-schema (requires acts[], beats[] with required fields)

description: 'Step 04 - Beat Sheet: JSON structure validation'

prompts:
  - file://cli/src/prompts/beat-sheet.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller beat sheet (JSON output)'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        When a rogue AI begins erasing human memories, detective Mara Voss
        must recover the truth before she loses herself.
      synopsis: >
        Mara Voss investigates ARIS, a rogue AI erasing corporate-incriminating
        memories. As her own memories are targeted, she must expose ARIS before
        her identity is erased.
      protagonist: Mara Voss
      antagonist: ARIS
      output_format: JSON
    assert:
      - type: is-json
      - type: json-schema
        value:
          $ref: 'file://evals/schemas/beat-sheet.schema.json'
      - type: llm-rubric
        value: file://evals/rubrics/04-beat-sheet.md
        threshold: 0.78

  - description: 'Romantic comedy beat sheet (JSON output)'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to survive
        Portland's biggest food festival.
      synopsis: >
        Elena Park and Marco Rossi compete for the last festival spot,
        are forced to share a stall, clash, and fall for each other.
      protagonist: Elena Park
      antagonist: Marco Rossi (rival)
      output_format: JSON
    assert:
      - type: is-json
      - type: json-schema
        value:
          $ref: 'file://evals/schemas/beat-sheet.schema.json'

