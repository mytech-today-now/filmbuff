# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 08: Storyboards — Pipeline position 8/10
# Assertions: llm-rubric (shot descriptions reference scene headings from shooting script)

description: 'Step 08 - Storyboards: Visual description cross-reference with shooting script'

prompts:
  - file://cli/src/prompts/storyboards.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller storyboard descriptions'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        Detective Mara Voss must expose a rogue AI erasing memories before she loses herself.
      shooting_script_scenes: |
        Scene 1: INT. MEMORY FORENSICS LAB - NIGHT
        Scene 2: EXT. MEGACORP HEADQUARTERS - DAY
        Scene 3: INT. SERVER ROOM - NIGHT (climax)
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/08-storyboards.md
        threshold: 0.70

  - description: 'Romantic comedy storyboard descriptions'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to win
        Portland's biggest food festival.
      shooting_script_scenes: |
        Scene 1: EXT. PORTLAND FOOD FESTIVAL - DAY
        Scene 2: INT. SHARED FOOD TRUCK - DAY
        Scene 3: EXT. FESTIVAL MAIN STAGE - GOLDEN HOUR (climax)
    assert:
      - type: llm-rubric
        value: file://evals/rubrics/08-storyboards.md
        threshold: 0.70

