# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Step 09: Shot List — Pipeline position 9/10
# Assertions: is-json + json-schema (requires shots[] with id, scene, type, description)

description: 'Step 09 - Shot List: JSON structure validation'

prompts:
  - file://cli/src/prompts/shot-list.txt

providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

tests:
  - description: 'Sci-fi thriller shot list (JSON output)'
    vars:
      genre: sci-fi thriller
      tone: dark and tense
      budget: mid-budget
      logline: >
        Detective Mara Voss must expose a rogue AI erasing memories before she loses herself.
      shooting_script_excerpt: |
        1  INT. MEMORY FORENSICS LAB - NIGHT
           Mara studies holographic memory fragments. Lights flicker.
        2  EXT. MEGACORP HEADQUARTERS - DAY
           Mara approaches the glass tower alone.
      output_format: JSON
    assert:
      - type: is-json
      - type: json-schema
        value:
          $ref: 'file://evals/schemas/shot-list.schema.json'
      - type: llm-rubric
        value: file://evals/rubrics/09-shot-list.md
        threshold: 0.78

  - description: 'Romantic comedy shot list (JSON output)'
    vars:
      genre: romantic comedy
      tone: light and witty
      budget: low-budget indie
      logline: >
        Two rival food truck owners discover they need each other to win
        Portland's biggest food festival.
      shooting_script_excerpt: |
        1  EXT. PORTLAND FOOD FESTIVAL - DAY
           Elena and Marco grab for the same permit form.
        2  INT. SHARED FOOD TRUCK - DAY
           They argue over who controls the grill.
      output_format: JSON
    assert:
      - type: is-json
      - type: json-schema
        value:
          $ref: 'file://evals/schemas/shot-list.schema.json'
      - type: llm-rubric
        value: file://evals/rubrics/09-shot-list.md
        threshold: 0.78

