# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# FilmBuff Evaluation Suite - Root Configuration
# Run: npm run eval  OR  npx promptfoo eval --config evals/promptfooconfig.yaml
# All API keys are loaded from .env (gitignored); never hardcode keys here.

description: 'FilmBuff 10-Step Screenplay Pipeline - Evaluation Suite'

# ---------------------------------------------------------------------------
# Environment / Secrets
# ---------------------------------------------------------------------------
env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}

# ---------------------------------------------------------------------------
# Default Providers (can be overridden per-step)
# ---------------------------------------------------------------------------
providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0
      max_tokens: 1024
  - id: google:gemini-3.1-pro-preview
    config:
      temperature: 0
      max_tokens: 1024

# ---------------------------------------------------------------------------
# Default Assertion Thresholds
# ---------------------------------------------------------------------------
defaultTest:
  assert:
    - type: llm-rubric
      threshold: 0.7

# ---------------------------------------------------------------------------
# Include all per-step configs
# ---------------------------------------------------------------------------
import:
  - steps/01-logline.yaml
  - steps/02-synopsis.yaml
  - steps/03-treatment.yaml
  - steps/04-beat-sheet.yaml
  - steps/05-screenplay.yaml
  - steps/06-shooting-script.yaml
  - steps/07-script-breakdown.yaml
  - steps/08-storyboards.yaml
  - steps/09-shot-list.yaml
  - steps/10-final-screenplay.yaml

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
outputPath: evals/results/eval-output.json

